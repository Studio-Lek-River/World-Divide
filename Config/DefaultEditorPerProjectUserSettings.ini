; The Unreal MCP server (ue.ps1 -Task editor, docs/ui/AI_TEAM.md) offers the AI team only looking and playing.
; Toolsets and tools that are not on this allow-list are hidden from list_toolsets and refused by call_tool, so a
; toolset added by an engine update stays hidden until it is listed here. Each pattern covers a toolset and the
; tools of it that only read, capture, log, run PIE or run console commands.
[/Script/ToolsetRegistry.ToolsetRegistrySettings]
+AllowedNames=/^WorldDivideMCP\.RTSConsoleToolset(\.ExecuteConsoleCommand)?$/
+AllowedNames=/^EditorToolset\.LogsToolset(\.(GetLogEntries|GetLogCategories|GetVerbosity|SetVerbosity))?$/
+AllowedNames=/^EditorToolset\.EditorAppToolset(\.(IsPIERunning|StartPIE|StopPIE|CaptureViewport|CaptureEditorImage|CaptureAssetImage|GetVisibleActors|GetSelectedActors|SelectActors|FocusOnActors|GetCameraTransform|SetCameraTransform|WorldPosToScreenCoords|ScreenCoordsToWorld|SearchCVars))?$/
+AllowedNames=/^SlateInspectorToolset\.SlateInspectorToolset(\.(Snapshot|Screenshot|Windows|WaitFor|Hover|Observe|Unobserve|ListObservers))?$/
+AllowedNames=/^editor_toolset\.toolsets\.scene\.SceneTools(\.(find_actors|get_current_level|get_folders|get_actors_in_folder|get_collision_channels|trace_world))?$/
+AllowedNames=/^editor_toolset\.toolsets\.actor\.ActorTools(\.(get_actor_transform|get_actor_bounds|get_components|get_component_actor|get_root_component|get_parent_component|get_label|get_tags|has_tag))?$/
+AllowedNames=/^editor_toolset\.toolsets\.object\.ObjectTools(\.(get_class|get_properties|list_properties|search_subclasses))?$/

; ExecuteConsoleCommand refuses commands matching these case-insensitive regexes: editor Python and anything that
; saves or deletes.
[WorldDivideMCP]
+BlockedConsoleCommands=^\s*py(thon)?\b
+BlockedConsoleCommands=\bsave
+BlockedConsoleCommands=\bdelete\b
