; The Unreal MCP server (ue.ps1 -Task editor, docs/ui/AI_TEAM.md) gives the AI team the editor's toolsets for looking,
; playing, and importing and editing assets, materials, meshes, textures, actors and levels. It listens on loopback only
; and only an editor opened with ue.ps1 -Task editor loads it; headless runs and packaged builds load none of the plugins.
; Toolsets that are not on this allow-list are hidden from list_toolsets and refused by call_tool, so a toolset added by
; an engine update stays hidden until it is listed here. The programmatic and skill toolsets (arbitrary Python) stay off.
[/Script/ToolsetRegistry.ToolsetRegistrySettings]
+AllowedNames=/^WorldDivideMCP\.RTSConsoleToolset/
+AllowedNames=/^EditorToolset\.(LogsToolset|EditorAppToolset)/
+AllowedNames=/^SlateInspectorToolset\.SlateInspectorToolset/
+AllowedNames=/^editor_toolset\.toolsets\.(asset\.AssetTools|static_mesh\.StaticMeshTools|skeletal_mesh\.SkeletalMeshTools|texture\.TextureTools|material\.MaterialTools|material_instance\.MaterialInstanceTools|primitive\.PrimitiveTools|data_asset\.DataAssetTools|data_table\.DataTableTools|curve_table\.CurveTableTools|string_table\.StringTableTools|blueprint\.BlueprintTools|scene\.SceneTools|actor\.ActorTools|object\.ObjectTools)/

; ExecuteConsoleCommand refuses commands matching these case-insensitive regexes: editor Python and console commands that
; save or delete. The asset toolsets above save and delete through their own tools.
[WorldDivideMCP]
+BlockedConsoleCommands=^\s*py(thon)?\b
+BlockedConsoleCommands=\bsave
+BlockedConsoleCommands=\bdelete\b
