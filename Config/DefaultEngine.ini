[/Script/Engine.CollisionProfile]
; The Water plugin river's surface (#381): the water mesh draws a river only over its enabled collision, so it queries,
; but as its own object type that no trace or overlap asks for, and it ignores every channel. Ground stays the bed.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=False,bStaticObject=False,Name="WaterSurface")
+Profiles=(Name="RTSWaterSurface",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="WaterSurface",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore)),HelpMessage="A water surface that only the Water plugin's water mesh reads; nothing hits it.")

[/Script/Water.WaterRuntimeSettings]
; New water bodies take RTSWaterSurface rather than the plugin's world-static WaterBodyCollision, which RTSGround's traces
; would stop on; the Water editor module checks that this profile exists in every editor run (#382).
DefaultWaterCollisionProfileName=RTSWaterSurface

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
; Clients keep a navmesh too, so the building ghost runs the same placement check as the server.
bAllowClientSideNavigation=True
; No unit uses crowd following. Without a crowd manager nothing warns about a missing navmesh when a world tears down.
CrowdManagerClass=None
; Agent classes by width, narrowest first: a unit walks the navmesh of the narrowest class at least as wide as its hull
; (RTSNavAgents::SelectAgent), so a new class needs only a line here. Infantry is the default navmesh. Sizes are the scale
; standard's (docs/tech/scale/WORLD_SCALE_STANDARD.md, rule 4).
+SupportedAgents=(Name="Infantry",Color=(R=140,G=255,B=0,A=164),DefaultQueryExtent=(X=50.0,Y=50.0,Z=250.0),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=40.0,AgentHeight=180.0,AgentStepHeight=35.0)
+SupportedAgents=(Name="Vehicle",Color=(R=255,G=160,B=0,A=164),DefaultQueryExtent=(X=200.0,Y=200.0,Z=250.0),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=190.0,AgentHeight=350.0,AgentStepHeight=35.0)

[/Script/NavigationSystem.RecastNavMesh]
; Rebuild tiles at runtime so placed buildings cut the navmesh.
RuntimeGeneration=Dynamic
; Large tiles for 2 km maps; the cell size sets how finely building holes and gaps are cut (measured in plan section 7).
TileSizeUU=6400.0
NavMeshResolutionParams[0]=(CellSize=25.0,CellHeight=10.0,AgentMaxStepHeight=35.0)
NavMeshResolutionParams[1]=(CellSize=25.0,CellHeight=10.0,AgentMaxStepHeight=35.0)
NavMeshResolutionParams[2]=(CellSize=25.0,CellHeight=10.0,AgentMaxStepHeight=35.0)

